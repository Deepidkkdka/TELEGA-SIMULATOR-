<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a13">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ORBIT Messenger</title>
<style>
:root{--bg:#0a0a13;--p1:#13131e;--p2:#1b1b2a;--p3:#262639;--ln:#25253a;--tx:#f2f1ff;--mut:#8d8ca9;--ac:#7c5cff;--ac2:#5b8cff;--ok:#38d996;--er:#ff5470;--bin:#1d1d2f;--wall:#0c0c17;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--ease:cubic-bezier(.22,.9,.3,1)}
[data-t=light]{--bg:#e9ebf5;--p1:#fff;--p2:#f1f2fa;--p3:#e4e6f4;--ln:#dfe1f0;--tx:#16152b;--mut:#6f6e8c;--bin:#fff;--wall:#e2e5f4}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;top:0;left:0;right:0;height:var(--vh,100%);background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--p3);border-radius:12px;padding:10px 16px;transition:transform .12s,filter .15s,background .2s,opacity .2s}
button:active{transform:scale(.95)}
button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
button.d{background:var(--er);color:#fff}
button.s{padding:6px 11px;font-size:14px;border-radius:9px}
button.ic{width:40px;height:40px;padding:0;border-radius:50%;background:none;display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
button.ic:active{background:var(--p3)}
button.wide{width:100%;margin-top:8px}
button:disabled{opacity:.4;pointer-events:none}
input,select,textarea{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;width:100%;outline:0;font-size:16px;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
input[type=checkbox]{width:auto}
h2{font-size:24px}h3{font-size:19px;margin-bottom:10px}
a{color:var(--ac2)}
.hide{display:none!important}.grow{flex:1;min-width:0}.mut{color:var(--mut)}.c{text-align:center}.small{font-size:13px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end;margin-top:14px}
code{background:var(--p3);padding:1px 6px;border-radius:6px;font-size:13px}
/* layout */
#app{position:absolute;inset:0}
#shell{position:absolute;inset:0;display:flex}
.rail{width:74px;background:var(--p1);border-right:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;z-index:5;flex:none}
.rail .logo{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 200deg,#7c5cff,#5b8cff,#ff4d8d,#7c5cff);margin-bottom:12px;position:relative}
.rail .logo:after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--p1)}
.tab{width:58px;padding:8px 0 6px;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);position:relative;border-radius:14px;font-size:11px}
.tab.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.nb{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--ac);color:#fff;font-size:11px;font-weight:600;display:none;align-items:center;justify-content:center;padding:0 5px}
.nb.on{display:flex;animation:badge .3s var(--ease)}
.tab .nb{right:6px}
.stage{flex:1;position:relative;min-width:0;display:flex}
.list{width:380px;flex:none;background:var(--p1);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.chat{flex:1;min-width:0;position:relative;background:var(--wall)}
.cw{display:flex;flex-direction:column;height:100%;position:relative}
.page{flex:1;overflow-y:auto;display:none;background:var(--bg);-webkit-overflow-scrolling:touch}
.page.in .pg{animation:fadeUp .35s var(--ease)}
.v-page .list,.v-page .chat{display:none}.v-page .page{display:block}
.chat .ph{display:none;height:100%;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--mut)}
@media(min-width:821px){.shell-nochat .chat .ph{display:flex}.shell-nochat .chat .cw{display:none}.list{width:390px}}
@media(max-width:820px){
 #shell{flex-direction:column-reverse}
 .rail{width:100%;height:calc(58px + var(--sab));flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--ln);padding:5px 4px var(--sab);gap:0}
 .rail .logo{display:none}.tab{flex:1;width:auto;max-width:90px}
 .stage{display:block}
 .list{position:absolute;inset:0;width:100%;border:0;transition:transform .38s var(--ease),filter .38s}
 .chat{position:fixed;top:0;left:0;right:0;height:var(--vh,100%);z-index:30;transform:translateX(104%);transition:transform .38s var(--ease);box-shadow:-14px 0 40px #0008}
 .chat-open .chat{transform:none}
 .chat-open .list{transform:translateX(-24%);filter:brightness(.55)}
 .page{position:absolute;inset:0}
}
/* avatars & badges */
.av{width:var(--s,48px);height:var(--s,48px);border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:calc(var(--s,48px)*.42);position:relative;user-select:none}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.dot{position:absolute;right:-1px;bottom:-1px;width:28%;height:28%;border-radius:50%;background:var(--ok);border:2.5px solid var(--p1)}
.vf{width:16px;height:16px;vertical-align:-3px;margin-left:4px;flex:none}
.vip{font-size:13px;margin-left:3px}.scam{background:#e5484d;color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;margin-left:5px;vertical-align:2px;letter-spacing:.6px;display:inline-block}.sup{background:linear-gradient(135deg,#2f8cff,#7a5cff);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;margin-left:5px;vertical-align:2px;letter-spacing:.6px;display:inline-block}.scamw{background:color-mix(in srgb,#e5484d 18%,transparent);color:#ff8a8f;border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.35;margin:10px 0}
/* list */
.lh{padding:calc(10px + var(--sat)) 12px 4px}
.lt{display:flex;align-items:center;gap:4px;margin-bottom:8px;padding-left:4px}
.brand{font-weight:800;font-size:22px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.orb{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 200deg,#7c5cff,#5b8cff,#ff4d8d,#7c5cff);animation:spin 8s linear infinite}
.conn{font-size:12px;color:var(--ok);margin-right:4px}
.srch{display:flex;align-items:center;gap:8px;background:var(--p2);border-radius:14px;padding:0 12px;color:var(--mut)}
.srch input{background:none;border:0;padding:11px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:18px;background:var(--p2);font-size:14px;color:var(--mut)}
.chip.on{background:var(--ac);color:#fff}
.lrows{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px}
.cr{display:flex;gap:12px;padding:9px 14px;align-items:center;cursor:pointer;position:relative;transition:background .15s}
.cr:active{background:var(--p2)}
@media(hover:hover){.cr:hover{background:var(--p2)}}
.cr.on{background:var(--ac)!important;color:#fff}.cr.on .mut,.cr.on .pv{color:#ffffffcc!important}
.cr .tp{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cr b{font-weight:600}.cr .tm{font-size:12px;color:var(--mut);flex:none}
.cr .pv{color:var(--mut);font-size:15px;display:flex;justify-content:space-between;gap:8px;margin-top:2px}
.cr .pv span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr .ub{background:var(--ac);color:#fff;border-radius:11px;min-width:22px;height:22px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px;flex:none;animation:badge .3s var(--ease)}
.cr.on .ub{background:#fff;color:var(--ac)}
.typing-t{color:var(--ac2)!important}
.sect{padding:14px 16px 6px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.rin{animation:fadeUp .3s var(--ease)}
.empty{padding:40px 24px;text-align:center;color:var(--mut)}
/* chat */
.chh{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--sat)) 8px 8px 4px;background:var(--p1);border-bottom:1px solid var(--ln);z-index:3;flex:none}
.chh .who2{flex:1;min-width:0;cursor:pointer;padding:2px 0}
.chh .st{font-size:13px;color:var(--mut)}.chh .st.ty{color:var(--ac2)}
.back{display:none!important}
@media(max-width:820px){.back{display:inline-flex!important}}
.pin{display:flex;gap:10px;align-items:center;padding:7px 14px;background:var(--p1);border-bottom:1px solid var(--ln);font-size:14px;cursor:pointer;flex:none}
.pin:before{content:"";width:3px;height:30px;background:var(--ac);border-radius:2px}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:10px 10px 8px;background:radial-gradient(800px 500px at 10% 0%,#7c5cff1c,transparent 60%),radial-gradient(700px 500px at 100% 100%,#5b8cff18,transparent 60%),radial-gradient(#ffffff09 1px,transparent 1px) 0 0/24px 24px,var(--wall);-webkit-overflow-scrolling:touch;scroll-behavior:auto}
[data-t=light] .msgs{background:radial-gradient(800px 500px at 10% 0%,#7c5cff22,transparent 60%),radial-gradient(#00000010 1px,transparent 1px) 0 0/24px 24px,var(--wall)}
.mrow{display:flex;gap:6px;align-items:flex-end;margin-top:2px}
.mrow.first{margin-top:9px}.mrow.me{justify-content:flex-end}
.mrow .sp{width:34px;flex:none}
.bub{max-width:min(80%,520px);padding:7px 11px 5px;border-radius:19px;background:var(--bin);position:relative;overflow-wrap:anywhere;box-shadow:0 1px 2px #0003;cursor:pointer}
.mrow:not(.me) .bub{border-bottom-left-radius:6px}.mrow:not(.me) .bub.mid{border-top-left-radius:6px}
.mrow.me .bub{background:linear-gradient(135deg,#7c5cff,#5b7bff);color:#fff;border-bottom-right-radius:6px}.mrow.me .bub.mid{border-top-right-radius:6px}
.bub .tx{white-space:pre-wrap}
.bub .meta{float:right;margin:7px 0 -1px 12px;font-size:11px;opacity:.7;white-space:nowrap;line-height:1}
.bub .meta .rd{color:#7fe3ff}.mrow:not(.me) .bub .meta{opacity:.55}
.bub:after{content:"";display:block;clear:both}
.who{font-size:13.5px;font-weight:600;margin-bottom:1px}
.rq{border-left:3px solid var(--ac2);padding:1px 8px;margin-bottom:4px;font-size:13.5px;opacity:.9;background:#ffffff10;border-radius:4px}
.rq b{display:block;font-size:13px}
.men{color:var(--ac2);font-weight:500}.me .men{color:#fff;text-decoration:underline}
.rxs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;clear:both}
.rxs:empty{display:none}
.rx{background:#ffffff1c;border-radius:12px;padding:2px 8px;font-size:13px;cursor:pointer;animation:badge .25s var(--ease)}
.rx.on{background:var(--ac);color:#fff}
.kb{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;clear:both}.kb button{flex:1;background:#ffffff22;color:inherit;padding:8px;font-size:14px;border-radius:10px}
.day{display:flex;justify-content:center;margin:12px 0 6px}.day span{background:#00000044;color:#fff;font-size:13px;padding:3px 12px;border-radius:12px;backdrop-filter:blur(6px)}
.sys{text-align:center;color:var(--mut);font-size:13px;margin:8px 0}
.pop{animation:popin .32s var(--ease)}
.typ .bub{padding:12px 14px;display:flex;gap:4px;cursor:default}
.typ i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:tdot 1.1s infinite}.typ i:nth-child(2){animation-delay:.15s}.typ i:nth-child(3){animation-delay:.3s}
.post{max-width:min(94%,560px);background:var(--bin);border-radius:19px;overflow:hidden;margin:7px 0;box-shadow:0 1px 2px #0003;cursor:pointer}
.post .ph2{padding:9px 14px 0;font-weight:600;color:var(--ac2);font-size:15px}
.post .pm{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;margin-top:8px}.post .pm span{font-size:72px;filter:drop-shadow(0 6px 14px #0006)}
.post .pt{padding:8px 14px 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.post .pf{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 12px 10px}
.post .pf .rxs{margin:0}.post .vw{font-size:12px;color:var(--mut);display:flex;gap:4px;align-items:center;white-space:nowrap}
.gc{margin:10px auto;width:220px;text-align:center;padding:16px 14px 12px;border-radius:22px;border:1.5px solid color-mix(in srgb,var(--rc) 60%,transparent);background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--rc) 35%,transparent),transparent 75%),var(--p1);cursor:pointer;box-shadow:0 8px 28px color-mix(in srgb,var(--rc) 25%,transparent)}
.gc .ge{font-size:68px;animation:fl 3s ease-in-out infinite;display:inline-block;filter:drop-shadow(0 8px 12px #0006)}
.gc .gm{font-style:italic;margin-top:6px;font-size:14px}.gc .mut{font-size:12px}
.fab{position:absolute;right:14px;bottom:84px;width:42px;height:42px;border-radius:50%;padding:0;background:var(--p1);box-shadow:0 4px 16px #0006;display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .25s var(--ease);z-index:4}
.fab.show{transform:scale(1)}
.rep{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;background:var(--p1);border-top:1px solid var(--ln);font-size:14px;flex:none}
.rep:before{content:"";width:3px;height:32px;background:var(--ac);border-radius:2px}
.comp{display:flex;align-items:flex-end;gap:6px;padding:8px 8px calc(8px + var(--sab));background:var(--p1);border-top:1px solid var(--ln);flex:none}
.comp .box{flex:1;background:var(--p2);border-radius:22px;display:flex;min-width:0}
.comp textarea{border:0;background:none;resize:none;height:40px;max-height:130px;padding:10px 12px;border-radius:22px;line-height:20px}
.sendb{width:42px;height:42px;padding:0;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.cbar{padding:10px 12px calc(10px + var(--sab));background:var(--p1);border-top:1px solid var(--ln);text-align:center;flex:none}
.cbar .lnk{background:none;color:var(--mut)}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:0;overflow:hidden;transition:max-height .3s var(--ease);background:var(--p1)}
.emo.open{max-height:200px;border-top:1px solid var(--ln);padding:6px}
.emo button{background:none;font-size:25px;padding:6px 0;border-radius:10px}
/* pages */
.pg{max-width:780px;margin:0 auto;padding:calc(16px + var(--sat)) 16px 30px}
.ph3{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:12px 0}

.seg{display:flex;background:var(--p2);border-radius:12px;padding:3px;margin:14px 0}.seg button{flex:1;background:none;padding:9px}.seg button.on{background:var(--ac);color:#fff}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:12px}
.gt{border-radius:20px;padding:14px 8px 12px;text-align:center;cursor:pointer;border:1.5px solid color-mix(in srgb,var(--rc) 50%,transparent);background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--rc) 30%,transparent),transparent 72%),var(--p2);transition:transform .2s var(--ease),box-shadow .2s;position:relative}
.gt:active{transform:scale(.95)}

.gt.sel{box-shadow:0 0 0 2.5px var(--ac),0 8px 24px color-mix(in srgb,var(--rc) 35%,transparent);transform:translateY(-2px)}
.r-common{--rc:#8a93a6}.r-rare{--rc:#4aa3ff}.r-epic{--rc:#b061ff}.r-legendary{--rc:#ffb020}.r-limited{--rc:#ff4d8d}
.r-legendary .e,.r-limited .e{filter:drop-shadow(0 0 14px var(--rc))}
.r-limited{animation:glow 2.2s ease-in-out infinite alternate}
.pc{text-align:center;padding-top:6px}
.pc h2{margin-top:10px}.pc .acts{display:flex;gap:10px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.pc .acts button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:84px;padding:10px 8px;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--ln)}.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:left}
.pgh{display:flex;align-items:center;gap:6px;margin:-4px 0 6px -8px}
/* modal */
.mv{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(6,6,16,.42);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);animation:fadeIn .25s ease}

.mp{width:100%;max-width:440px;max-height:calc(var(--vh,100vh) - 40px);overflow:auto;border-radius:28px;padding:20px;background:color-mix(in srgb,var(--p1) 80%,transparent);border:1px solid #ffffff22;box-shadow:0 20px 70px #0008;animation:zoomIn .35s var(--ease);-webkit-overflow-scrolling:touch}

.mp input,.mp select,.mp textarea{margin-bottom:8px;background:color-mix(in srgb,var(--p2) 85%,transparent)}
.dlgv{z-index:200}
.gfoot{position:sticky;bottom:-20px;margin:12px -20px -20px;padding:14px 20px 20px;background:linear-gradient(transparent,color-mix(in srgb,var(--p1) 92%,transparent) 22%)}
.prow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;cursor:pointer}.prow:active,.prow:hover{background:var(--p3)}
.sw{display:flex;align-items:center;gap:10px;margin:6px 0}

.bnc{pointer-events:auto;display:flex;gap:10px;align-items:center;width:100%;max-width:440px;padding:10px 14px;border-radius:20px;background:color-mix(in srgb,var(--p1) 82%,transparent);backdrop-filter:blur(20px);border:1px solid #ffffff1f;box-shadow:0 10px 40px #0007;cursor:pointer}

.cmenu{position:absolute;min-width:210px;background:color-mix(in srgb,var(--p1) 88%,transparent);backdrop-filter:blur(22px);border:1px solid #ffffff1f;border-radius:18px;padding:6px;box-shadow:0 14px 50px #0009;animation:zoomIn .22s var(--ease);transform-origin:top left}

function dlg(o){return new Promise(res=>{
 const el=document.createElement('div');el.className='mv dlgv';
 const f=o.options?`<select id="dlgin">${o.options.map(x=>`<option ${x===o.value?'selected':''}>${h(x)}</option>`).join('')}</select>`:o.input?`<input id="dlgin" value="${h(o.value||'')}" placeholder="${h(o.ph||'')}">`:'';
 el.innerHTML=`<div class="mp"><h3>${h(o.title||'')}</h3>${o.text?`<p class="mut" style="margin-bottom:10px">${h(o.text)}</p>`:''}${f}<div class="row end"><button class="c">${o.cancel||'Отмена'}</button><button class="${o.danger?'d':'p'} ok">${o.ok||'ОК'}</button></div></div>`;
 document.body.appendChild(el);const inp=el.querySelector('#dlgin');if(inp&&inp.tagName==='INPUT')setTimeout(()=>inp.focus(),60);
 const done=v=>{el.classList.add('out');setTimeout(()=>el.remove(),200);res(v)};
 el.querySelector('.c').onclick=()=>done(null);el.querySelector('.ok').onclick=()=>done(inp?inp.value:true);
 el.onclick=e=>{if(e.target===el)done(null)};if(inp)inp.onkeydown=e=>{if(e.key==='Enter')done(inp.value)};
})}

/* ====================== SCAM: последствия, уведомление, апелляции ====================== */
function noScam(u,what){if(u&&u.scam)throw Error('Аккаунт помечен как SCAM: '+what+' недоступна. Оспорьте пометку в настройках.')}
function ownedOf(u){return db.chats.filter(c=>c.owner===u.id&&c.type!=='dm')}
function scamLost(kind,t){
 const L=[];
 if(kind==='u'){
  if(t.verified)L.push('Галочка подтверждения');
  L.push('Рейтинг профиля: '+num(t.rating||0)+' → 0 (уровень 1)');
  if(t.bannerImg||(t.banner&&t.banner!==BANNERS[0].id))L.push('Баннер профиля сброшен на стандартный');
  const oc=ownedOf(t).filter(c=>c.verified);if(oc.length)L.push('Галочка у ваших каналов: '+oc.length);
  L.push('Нельзя отправлять и выдавать подарки, запускать раздачи');
  L.push('Нельзя покупать номера +888 и юзернеймы');
  L.push('Нельзя создавать подарки и рекламировать каналы');
  L.push('Профиль виден другим с меткой SCAM и предупреждением');
 }else{
  if(t.verified)L.push('Галочка канала');
  L.push('Реклама канала («ПОДПИШИТЕСЬ НА @…») недоступна');
  L.push('Канал виден другим с меткой SCAM и предупреждением');
 }
 return L;
}

function admUnscam(kind,id,silent){
 const r=txn(()=>{
  const a=needAdmin(),t=kind==='u'?U(id):db.chats.find(x=>x.id===id);if(!t||!t.scam)throw Error('Метки нет');
  const bk=t.scamBackup||{};t.scam=false;
  if(kind==='u'){
   if(bk.verified)t.verified=true;if(bk.rating!==undefined)t.rating=Math.max(t.rating||0,bk.rating);
   if(bk.banner!==undefined){t.banner=bk.banner;t.bannerImg=bk.bannerImg||null}
   (bk.chans||[]).forEach(cid=>{const c=db.chats.find(x=>x.id===cid);if(c)c.verified=true});
   if(!t.sim){t.notice=null;notify(t.id,'system','✅ Пометка SCAM снята. Возвращены: галочка, рейтинг, баннер. Ограничения сняты.')}
  }else{
   if(bk.verified)t.verified=true;const o=t.owner?U(t.owner):null;
   if(o&&!o.sim){if(o.notice&&o.notice.target===t.id)o.notice=null;notify(o.id,'system','✅ Пометка SCAM снята с канала «'+t.title+'»')}
  }

 });
 if(r){renderModal();render()}
}

/* ====================== Telegram-бот: сейф для токена ======================
   Токен НИКОГДА не лежит в коде и в базе. Он хранится только как AES-GCM шифротекст
   (ключ = PBKDF2 от парольной фразы суперадмина, 250 000 итераций) в отдельном ключе
   localStorage, а в расшифрованном виде живёт только в замыкании ниже — в памяти вкладки. */
const VKEY='orbit_vault';
const Vault=(()=>{
 let tok=null,run=false,ctl=null,off=0,log=[],ver=0;
 const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
 const note=m=>{log.unshift(new Date().toLocaleTimeString('ru')+' · '+m);log.length=Math.min(log.length,14);ver++;Vault.on&&Vault.on()};
 const clean=m=>tok?String(m).split(tok).join('***'):String(m);
 async function kdf(pass,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
 const stored=()=>{try{return JSON.parse(localStorage.getItem(VKEY)||'null')}catch(e){return null}};
 async function call(method,params,signal){
  if(!tok)throw Error('Токен заблокирован');
  let r;try{r=await fetch('https://api.telegram.org/bot'+tok+'/'+method,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(params||{}),signal})}catch(e){if(e.name==='AbortError')throw e;throw Error('Нет связи с api.telegram.org (сеть или ограничения страницы)')}
  const j=await r.json().catch(()=>({}));if(!j.ok)throw Error(clean(j.description||('HTTP '+r.status)));return j.result;
 }
 async function onUpdate(u){
  const m=u.message;if(!m||!m.chat||m.chat.type!=='private')return;const chat=m.chat.id,from=m.from||{};
  const say=(t,extra)=>call('sendMessage',{chat_id:chat,text:t,...(extra||{})}).catch(e=>note('sendMessage: '+e.message));
  const kb={reply_markup:{keyboard:[[{text:'📱 Поделиться номером',request_contact:true}]],resize_keyboard:true,one_time_keyboard:true}};
  if(m.contact){
   if(m.contact.user_id!==from.id)return say('Нужно отправить СВОЙ номер кнопкой ниже, а не чужой контакт.',kb);
   const d=String(m.contact.phone_number||'').replace(/\D/g,''),phone='+'+(d.length===11&&d[0]==='8'?'7'+d.slice(1):d);
   if(!/^\+7\d{10}$/.test(phone))return say('Принимаются только номера РФ (+7…).');
   db.tgLinks=db.tgLinks||[];
   const byTg=db.tgLinks.find(l=>l.tgId===from.id),byPh=db.tgLinks.find(l=>l.phone===phone);
   if(byTg&&byTg.phone!==phone)return say('К этому Telegram-аккаунту уже привязан другой номер. 1 аккаунт Telegram — 1 номер.');
   if(byPh&&byPh.tgId!==from.id)return say('Этот номер уже привязан к другому Telegram-аккаунту.');
   if(!byTg)db.tgLinks.push({phone,tgId:from.id,chat,name:[from.first_name,from.last_name].filter(Boolean).join(' '),ts:Date.now()});
   save();note('Привязан номер '+phone.slice(0,5)+'•••'+phone.slice(-2));
   return say('Готово ✅ Номер привязан. Вернитесь в ORBIT, откройте вкладку «Telegram» и запросите код входа.',{reply_markup:{remove_keyboard:true}});
  }
  const t=(m.text||'').trim();
  if(t.startsWith('/start')||t.startsWith('/help'))return say('Привет! Это бот входа в ORBIT. Нажмите кнопку ниже, чтобы подтвердить номер телефона. Код входа я пришлю сюда.',kb);
  return say('Чтобы войти в ORBIT, нажмите «📱 Поделиться номером». Код придёт сюда.',kb);
 }
 async function loop(){
  while(run){
   try{const r=await call('getUpdates',{offset:off,timeout:20,allowed_updates:['message']},ctl.signal);for(const u of r){off=u.update_id+1;await onUpdate(u)}}
   catch(e){if(!run||e.name==='AbortError')break;note('Ошибка: '+e.message);await new Promise(r=>setTimeout(r,5000))}
  }
 }
 return{
  on:null,
  get has(){return !!stored()},get unlocked(){return !!tok},get running(){return run},get log(){return log},get ver(){return ver},
  async seal(token,pass){
   token=(token||'').trim();if(!/^\d{6,12}:[A-Za-z0-9_-]{30,}$/.test(token))throw Error('Это не похоже на токен бота (формат 123456789:AA…)');
   if((pass||'').length<8)throw Error('Парольная фраза — минимум 8 символов');
   const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await kdf(pass,salt);
   const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(token));
   localStorage.setItem(VKEY,JSON.stringify({v:1,salt:b64(salt),iv:b64(iv),ct:b64(ct)}));tok=token;note('Токен зашифрован и сохранён');
  },
  async unlock(pass){
   const o=stored();if(!o)throw Error('Токен не сохранён');
   try{const k=await kdf(pass||'',ub(o.salt)),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},k,ub(o.ct));tok=new TextDecoder().decode(pt)}
   catch(e){throw Error('Неверная парольная фраза')}
   note('Токен разблокирован (только в памяти этой вкладки)');
  },
  lock(){this.stop();tok=null;note('Токен заблокирован')},
  wipe(){this.stop();tok=null;localStorage.removeItem(VKEY);note('Токен удалён')},
  call,
  start(){if(!tok)throw Error('Сначала разблокируйте токен');if(run)return;run=true;ctl=new AbortController();try{off=+localStorage.getItem('orbit_tgoff')||0}catch(e){}note('Бот запущен');loop()},
  stop(){if(!run)return;run=false;try{ctl&&ctl.abort();localStorage.setItem('orbit_tgoff',String(off))}catch(e){}note('Бот остановлен')}
 };
})();

<div class="scamw" style="margin-top:0"><b>Важно про безопасность.</b> Страница, работающая целиком в браузере, не может скрыть секрет от того, кто её открыл и знает фразу. Шифрование защищает токен «в покое» (в файле, в GitHub, в localStorage), но бот работает только пока эта вкладка открыта и разблокирована. Для настоящей защиты токен нужно держать на сервере (например, Cloudflare Worker или Vercel Function) — страница тогда ходит к вашему прокси, а не к Telegram напрямую. Если токен хоть раз попал в чат или публичный репозиторий — отзовите его: @BotFather → /revoke.</div>`;

/* --- вход по коду из Telegram --- */
function tgAuthHtml(){
 const st=S.tgStep||'phone',bn=db.cfg&&db.cfg.botName;
 if(st==='code')return `<p class="mut c" style="margin-bottom:10px">Код отправлен ботом в ваш Telegram. Он действует 5 минут.</p><input id="tcd" inputmode="numeric" maxlength="6" placeholder="••••••" style="text-align:center;font-size:24px;letter-spacing:6px" onkeydown="if(event.key==='Enter')tgVerify()"><button class="p wide" onclick="tgVerify()">Подтвердить</button><button class="wide" onclick="S.tgStep='phone';renderAuth()">Другой номер</button>`;
 return `<p class="mut small" style="margin-bottom:8px">1) Откройте бота${bn?' <b>@'+h(bn)+'</b>':''} в Telegram и нажмите «Поделиться номером».<br>2) Введите этот же номер здесь — бот пришлёт код.</p><input id="tph" inputmode="tel" value="+7" placeholder="+7 999 000-00-00"><button class="p wide" onclick="tgSendCode()">Получить код в Telegram</button>`;
}
async function tgSendCode(){
 const phone=normPhone($('#tph').value);
 if(!/^\+7\d{10}$/.test(phone))return toast('Введите номер РФ в формате +7XXXXXXXXXX',true);
 const link=(db.tgLinks||[]).find(l=>l.phone===phone);
 if(!link)return toast('Номер не привязан. Сначала откройте бота в Telegram и поделитесь номером'+(db.cfg.botName?' (@'+db.cfg.botName+')':''),true);
 if(!Vault.running)return toast('Бот сейчас офлайн: владелец должен запустить его в админ-панели',true);
 const old=db.tgCodes[phone];if(old&&now()-old.ts<30000)return toast('Подождите 30 секунд перед повторной отправкой',true);
 const a=new Uint32Array(1);crypto.getRandomValues(a);const code=String(100000+a[0]%900000),salt=uid();
 try{await Vault.call('sendMessage',{chat_id:link.chat,text:'Код входа в ORBIT: '+code+'\nНикому его не сообщайте.'})}catch(e){return toast('Не удалось отправить код: '+e.message,true)}
 db.tgCodes[phone]={salt,h:await hash(code,salt),exp:now()+300000,ts:now(),tries:0};save();
 S.tgPhone=phone;S.tgStep='code';renderAuth();toast('Код отправлен в Telegram');
}
async function tgVerify(){
 const phone=S.tgPhone,e=db.tgCodes[phone],v=($('#tcd').value||'').trim();
 if(!e||now()>e.exp){delete db.tgCodes[phone];save();S.tgStep='phone';renderAuth();return toast('Код истёк. Запросите новый',true)}
 if(e.tries>=5){delete db.tgCodes[phone];save();S.tgStep='phone';renderAuth();return toast('Слишком много попыток. Запросите новый код',true)}
 if((await hash(v,e.salt))!==e.h){e.tries++;save();return toast('Неверный код',true)}
 delete db.tgCodes[phone];save();
 const u=db.users.find(x=>x.phone===phone&&!x.isBot&&!x.sim);
 if(u){if(u.blocked)return toast('Аккаунт заблокирован: '+(u.blockReason||''),true);setUid(u.id);addAcct(u.id);onLogin(u);resetUi();render();toast('Вы вошли как '+u.name);return}
 S.tgOk=phone;S.authTab='up';S.tgStep='phone';renderAuth();toast('Номер подтверждён — завершите регистрацию');
}

/* ====================== ОНЛАЙН: общая база артефакта (db + room) ======================
   Люди на разных устройствах видят друг друга и переписываются:
   · ou/{viewerId}  — публичный профиль активного аккаунта (пишет только сам человек);
   · om/{msgId}     — текстовые сообщения: общий чат «ORBIT Онлайн» (room=lobby) и личка (to=[a,b]).
   Если платформа не даёт db (страница открыта локально) — всё работает офлайн, как раньше. */
const Online=(()=>{
 let D=null,vid=null,room=null,ready=false,canW=true,uns=[],bound=null,pend=[],lastSig='',peers=new Set(),inited=false;
 const LOBBY='orbit_online';
 const touch=()=>{try{dirty=true;saveSoon();softRender()}catch(e){}};
 const err=e=>{try{console.warn('online',e&&e.code||e)}catch(x){}};
 const lobby=()=>db.chats.find(c=>c.id===LOBBY);
 function stub(doc){
  const x=doc.data();if(!x||!x.uid)return;const m=me();if(m&&x.uid===m.id)return;
  let u=db.users.find(y=>y.id===x.uid);if(u&&!u.remote)return;
  if(!u){if(db.users.some(y=>y.username===x.username))return;
   u={id:x.uid,remote:true,role:'user',stars:0,settings:{sound:true,hideContent:false,cats:{message:true,gift:true,stars:true,number:true,system:true}},blockedUsers:[],showColl:true,created:x.created||now(),lastSeen:0};db.users.push(u)}
  Object.assign(u,{vid:doc.id,username:x.username,name:x.name,phone:x.phone||null,virtual:x.virtual||null,showNumber:x.showNumber||'main',rating:x.rating||0,verified:!!x.verified,support:!!x.support,scam:!!x.scam,bio:x.bio||'',alts:x.alts||[],banner:x.banner||undefined,avatar:x.avatar||undefined});
  const l=lobby();if(l&&!l.members.includes(u.id))l.members.push(u.id);
 }
 function applyMsg(ch){
  const id=ch.doc.id,d=ch.doc.data(),m0=me();if(!m0)return;
  if(ch.type==='removed'){const i=db.messages.findIndex(x=>x.id===id);if(i>=0&&db.messages[i].from!==m0.id){db.messages.splice(i,1);touch()}return}
  if(!d||db.tomb[id])return;
  const ex=db.messages.find(x=>x.id===id);
  if(ex){if(ex.text!==d.text){ex.text=d.text;ex.edited=!!d.edited;touch()}return}
  let c=null;
  if(d.room==='lobby')c=lobby();
  else if(Array.isArray(d.to)&&d.to.includes(m0.id)){const o=d.to.find(x=>x!==m0.id)||m0.id;if(!U(o)||!U(d.from)){pend.push(ch);return}c=dmWith(m0.id,o)}
  if(!c)return;if(!U(d.from)){pend.push(ch);return}
  const m={id,chatId:c.id,from:d.from,text:String(d.text||'').slice(0,2000),ts:d.ts||now(),readBy:[d.from],reactions:{},type:'text'};if(d.reply)m.reply=d.reply;if(d.edited)m.edited=true;
  db.messages.push(m);
  if(d.from!==m0.id&&c.type==='dm')notify(m0.id,'message',unameOf(d.from)+': '+m.text.slice(0,60));
  touch();
 }
 function pubOf(u){
  const p={uid:u.id,username:u.username,name:u.name,showNumber:u.showNumber||'main',rating:u.rating||0,verified:!!u.verified,support:!!u.support,scam:!!u.scam,bio:u.bio||'',banner:u.banner||null,created:u.created||0,
   phone:(u.phone&&(u.showNumber||'main')==='main')?u.phone:null,virtual:(u.virtual&&u.showNumber==='virtual')?u.virtual:null,
   alts:(u.alts||[]).map(a=>({name:a.name,price:a.price,ts:a.ts,how:a.how})),avatar:(u.avatar&&u.avatar.length<150000)?u.avatar:null};
  return p;
 }
 async function tickPub(){
  const u=me();if(!ready||!canW||!u||u.sim||u.remote)return;
  const p=pubOf(u),sig=JSON.stringify(p);if(sig===lastSig)return;lastSig=sig;
  try{await D.doc('ou/'+vid).set({...p,ts:now()})}catch(e){lastSig='';err(e)}
 }
 function markPeers(){let ch=false;db.users.forEach(u=>{if(u.remote&&peers.has(u.id)){u.lastSeen=now();ch=true}});if(ch)softRender()}
 function unbind(){uns.splice(1).forEach(f=>{try{f()}catch(e){}});bound=null}
 return{
  get ready(){return ready},get canWrite(){return canW},get count(){return Math.max(1,peers.size)},
  async init(){
   if(inited)return;inited=true;
   try{
    const c=window.claude;if(!c||!c.use)return;
    const [d,usr,rm]=await Promise.all([c.use('db'),c.use('user'),c.use('room')]);
    if(!d||!usr)return;vid=await usr.id();if(!vid)return;
    canW=(await usr.can('data.write'))!==false;D=d;room=rm;ready=true;
    uns.push(D.collection('ou').onSnapshot(s=>{s.docChanges().forEach(ch=>{if(ch.type!=='removed')stub(ch.doc)});const q=pend.splice(0);q.forEach(applyMsg);touch()},err));
    if(room){try{room.onPeers(ch=>{peers=new Set(ch.peers.map(p=>p.presence&&p.presence.uid).filter(Boolean));markPeers()},err)}catch(e){err(e)}}
    setInterval(tickPub,4000);setInterval(markPeers,15000);
    const m=me();if(m)this.bind(m);
    if(!canW)toast('Онлайн только для чтения: владелец должен дать вам доступ «Contributor»',true);
   }catch(e){err(e)}
  },
  bind(u){
   if(!ready||!u||u.sim||u.remote||bound===u.id)return;unbind();bound=u.id;lastSig='';
   try{
    uns.push(D.collection('om').where('to','array-contains',u.id).limit(500).onSnapshot(s=>s.docChanges().forEach(applyMsg),err));
    uns.push(D.collection('om').where('room','==','lobby').orderBy('ts','desc').limit(300).onSnapshot(s=>s.docChanges().forEach(applyMsg),err));
    if(room)room.presence({uid:u.id}).catch(err);
   }catch(e){err(e)}
   tickPub();
  },
  async push(m,c){
   try{
    if(!ready||!canW||m.type!=='text')return;const u=me();if(!u||m.from!==u.id)return;
    const d={id:m.id,from:u.id,text:m.text,ts:m.ts,type:'text'};
    if(c.id===LOBBY)d.room='lobby';
    else if(c.type==='dm'){const o=c.members.find(x=>x!==u.id),ou=U(o);if(!ou||!ou.remote)return;d.to=[u.id,o]}else return;
    if(m.reply)d.reply=m.reply;if(m.edited)d.edited=true;
    await D.doc('om/'+m.id).set(d);
   }catch(e){err(e)}
  },
  forget(ids){
   try{const u=me();ids.forEach(id=>{db.tomb[id]=1;const m=db.messages.find(x=>x.id===id);if(ready&&canW&&m&&u&&m.from===u.id)D.doc('om/'+id).delete().catch(err)});
    const k=Object.keys(db.tomb);if(k.length>3000)k.slice(0,500).forEach(x=>delete db.tomb[x])}catch(e){err(e)}
  }
 };
})();

function prettyPhone(d){return /(\d)\1{2,}/.test(d)||/(012|123|234|345|456|567|678|789|987|876|765|654|543|432|321)/.test(d)||new Set(d.split('')).size<=4}
function genPhone(){let p,t=0;do{p='+79'+String(rnd(0,999999999)).padStart(9,'0');t++}while((prettyPhone(p.slice(2))||db.users.some(x=>x.phone===p))&&t<800);return p}

 let d=$('#drawer');if(!d){d=document.createElement('div');d.id='drawer';document.body.appendChild(d)}
 const u=me();if(!u)return;

 d.innerHTML=`<div class="dsc" onclick="closeDrawer()"></div><div class="dp"><div class="dh"><div style="display:flex;justify-content:space-between;align-items:flex-start">${av(u,64,true)}<button class="ic" onclick="closeDrawer()">${ic('x')}</button></div><div style="margin-top:10px"><b style="font-size:18px">${h(u.name)}</b>${vipb(u)}</div><div class="mut">@${h(u.username)}</div><div class="mut small" style="margin-top:4px">⭐ ${num(balance(u))} · Уровень ${levelOf(u.rating||0)}</div></div>${acctRowsHtml(u.id)}<div class="di" onclick="closeDrawer();addAccount()"><span class="e">＋</span>Добавить аккаунт</div><div style="height:1px;background:var(--ln);margin:6px 0"></div>${items.map(i=>`<div class="di ${S.view===i[0]?'on':''}" onclick="navTo('${i[0]}')"><span class="e">${i[1]}</span>${i[2]}${i[0]==='notifs'&&nn?`<span class="nb2">${nn}</span>`:''}</div>`).join('')}<div class="di" onclick="closeDrawer();openModal({type:'newgroup'})"><span class="e">👥</span>Новая группа или канал</div><div class="grow"></div><div class="mut small c" style="padding:12px">ORBIT · ${Online.ready?'онлайн-режим':'локальный режим'}</div></div>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('open')));

/* ====================== Симулятор: бизнесы ====================== */
const BIZ=[
 {name:'Кофейня «Орбита»',emoji:'☕',price:2000,income:70},
 {name:'Пиццерия «Галактика»',emoji:'🍕',price:5000,income:190},
 {name:'Заправка «КосмоОйл»',emoji:'⛽',price:12000,income:480},
 {name:'Отель «Туманность»',emoji:'🏨',price:30000,income:1300},
 {name:'Студия «Квазар»',emoji:'🎮',price:80000,income:3700},
 {name:'Спутниковая связь',emoji:'🛰️',price:200000,income:10000},
 {name:'Банк «Звёздный»',emoji:'🏦',price:500000,income:28000},
 {name:'Космопорт «Орбит-1»',emoji:'🚀',price:1500000,income:90000}
];
const bizInc=b=>Math.round(b.income*(1+.35*(b.level-1)));
const bizCap=b=>Math.round(b.price*(1+.4*(b.level-1))*1.5);
const bizUp=b=>Math.round(b.price*.6*b.level);
const bizAcc=b=>Math.floor(bizInc(b)*Math.min(12,(now()-b.collectAt)/36e5));
function bizPage(u){
 const mine=db.biz.filter(b=>b.owner===u.id),rest=db.biz.filter(b=>b.owner!==u.id),tot=mine.reduce((a,b)=>a+bizInc(b),0),acc=mine.reduce((a,b)=>a+bizAcc(b),0);
 const card=b=>{const o=b.owner?U(b.owner):null,m=b.owner===u.id,dots='●'.repeat(b.level)+'○'.repeat(5-b.level);
  return `<div class="bz ${m?'mine':''}"><div class="e">${b.emoji}</div><div class="grow"><b>${h(b.name)}</b><div class="lvdots">${dots}</div><div class="mut small">+${num(bizInc(b))} ⭐/час${m?` · накоплено ⭐ ${num(bizAcc(b))}`:o?` · владелец: ${h(o.name)}`:' · свободно'}${b.guardUntil>now()?' · 🛡':''}</div></div><div style="text-align:right">${m?`<button class="s p" onclick="bizCollect('${b.id}')">Собрать</button><div class="row" style="justify-content:flex-end;margin-top:6px;flex-wrap:nowrap">${b.level<5?`<button class="s" onclick="bizUpgrade('${b.id}')">⬆ ${num(bizUp(b))}</button>`:''}<button class="s" onclick="bizGuard('${b.id}')">🛡</button></div>`:`<button class="s p" onclick="bizBuy('${b.id}')">${b.owner?'Захватить':'Купить'}<br>${num(b.owner?bizCap(b):b.price)} ⭐</button>`}</div></div>`};
 return `<div class="ph3"><h2>Бизнес</h2><span class="mut">⭐ ${num(balance(u))}</span></div><p class="mut">Покупайте бизнесы, улучшайте и собирайте доход в Stars (копится до 12 часов). Чужой бизнес можно захватить за 1,5× цены. Но и у вас могут отобрать: щит 🛡 защищает на 24 часа.</p>
 <div class="card c"><div class="mut small">Ваш доход</div><div style="font-size:26px;font-weight:800">${num(tot)} ⭐/час</div>${mine.length?`<button class="p" style="margin-top:8px" onclick="bizCollect('all')">Собрать всё · ⭐ ${num(acc)}</button>`:'<div class="mut small">У вас пока нет бизнесов</div>'}</div>
 ${mine.length?`<h3 style="margin-top:14px">Мои бизнесы</h3>${mine.map(card).join('')}`:''}<h3 style="margin-top:14px">Рынок</h3>${rest.map(card).join('')}`;
}
function bizBuy(id){
 txn(()=>{const u=me();noScam(u,'покупка бизнеса');const b=db.biz.find(x=>x.id===id);if(!b)throw Error('Нет бизнеса');if(b.owner===u.id)throw Error('Он уже ваш');
  const p=b.owner?bizCap(b):b.price,prev=b.owner?U(b.owner):null;
  starOp(u,-p,'biz_buy',(b.owner?'Захват: ':'Покупка: ')+b.name);if(prev&&!prev.sim&&!prev.remote){starOp(prev,Math.round(p*.8),'biz_sold','Ваш бизнес «'+b.name+'» захвачен');notify(prev.id,'stars','Ваш бизнес «'+b.name+'» захватил '+u.name)}else if(prev&&prev.sim)prev.stars=(prev.stars||0)+Math.round(p*.8);
  b.owner=u.id;b.collectAt=now();toast((prev?'Захвачено: ':'Куплено: ')+b.name)});
 renderPage();renderRail();
}
function bizUpgrade(id){
 txn(()=>{const u=me(),b=db.biz.find(x=>x.id===id);if(!b||b.owner!==u.id)throw Error('Не ваш бизнес');if(b.level>=5)throw Error('Максимальный уровень');
  bizCollectCore(u,b);starOp(u,-bizUp(b),'biz_upgrade','Улучшение: '+b.name);b.level++;toast(b.name+': уровень '+b.level)});
 renderPage();renderRail();
}
function bizGuard(id){
 txn(()=>{const u=me(),b=db.biz.find(x=>x.id===id);if(!b||b.owner!==u.id)throw Error('Не ваш бизнес');const c=Math.round(b.price*.25);
  starOp(u,-c,'biz_guard','Охрана: '+b.name);b.guardUntil=now()+864e5;toast('🛡 Охрана на 24 часа: '+b.name)});
 renderPage();renderRail();
}
function bizCollectCore(u,b){const a=bizAcc(b);if(a>0)starOp(u,a,'biz_income','Доход: '+b.name);b.collectAt=now();return a}
function bizCollect(id){
 let got=0;
 txn(()=>{const u=me();noScam(u,'сбор дохода');db.biz.filter(b=>b.owner===u.id&&(id==='all'||b.id===id)).forEach(b=>{got+=bizCollectCore(u,b)});if(!got)throw Error('Пока нечего собирать');toast('+'+num(got)+' ⭐ собрано')});
 renderPage();renderRail();
}
function bizRaid(real){
 const mine=db.biz.filter(b=>real.some(r=>r.id===b.owner));if(!mine.length)return;
 const b=pick(mine),o=U(b.owner),sims=db.users.filter(x=>x.sim);if(!o||!sims.length)return;
 if(b.guardUntil>now()){notify(o.id,'system','🛡 Рейд на «'+b.name+'» отбит охраной');return}
 const s=pick(sims);try{const g=Math.round(b.price*.6);starOp(o,g,'biz_raid','Рейд: '+b.name);bizCollectCore(o,b)}catch(e){}
 b.owner=s.id;b.collectAt=now();notify(o.id,'system','⚠️ '+s.name+' захватил(а) ваш бизнес «'+b.name+'». Компенсация выплачена. Верните его на вкладке «Бизнес» или поставьте охрану.');
}
